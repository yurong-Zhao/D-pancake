// 强制在页面上显示错误
window.onerror = function(message, source, lineno, colno, error) {
    document.body.innerHTML += '<div style="position:fixed; bottom:0; left:0; background:red; color:white; z-index:9999; padding:10px;">错误：' + message + ' at ' + lineno + '</div>';
    console.error(message, source, lineno, error);
    return false;
};
console.log("脚本开始执行");
// ========== Firebase 数据操作 ==========
let isSyncing = false;

async function loadPlansFromFirestore() {
    if (!window.firebaseReady) return;
    const plansRef = collection(window.db, "plans");
    const snapshot = await getDocs(plansRef);
    window.planData = [];
    snapshot.forEach(doc => {
        window.planData.push({ id: doc.id, ...doc.data() });
    });
    // 把 id 转成数字类型（保持兼容）
    window.planData = window.planData.map(p => ({ ...p, id: isNaN(Number(p.id)) ? p.id : Number(p.id) }));
    renderCalendar();
    renderPlanList();
}

function listenPlansRealtime() {
    if (!window.firebaseReady) return;
    const plansRef = collection(window.db, "plans");
    onSnapshot(plansRef, (snapshot) => {
        if (isSyncing) return;
        isSyncing = true;
        snapshot.docChanges().forEach(change => {
            if (change.type === "added" || change.type === "modified") {
                const existingIndex = window.planData.findIndex(p => p.id == change.doc.id);
                const newData = { id: change.doc.id, ...change.doc.data() };
                if (existingIndex >= 0) {
                    window.planData[existingIndex] = newData;
                } else {
                    window.planData.push(newData);
                }
            } else if (change.type === "removed") {
                window.planData = window.planData.filter(p => p.id != change.doc.id);
            }
        });
        renderCalendar();
        renderPlanList();
        isSyncing = false;
    });
}

async function syncAllPlansToFirestore() {
    if (!window.firebaseReady || isSyncing) return;
    isSyncing = true;
    for (const plan of window.planData) {
        const planRef = doc(window.db, "plans", String(plan.id));
        const { id, ...data } = plan;
        await setDoc(planRef, data);
    }
    isSyncing = false;
}

async function deletePlanFromFirestore(planId) {
    if (!window.firebaseReady) return;
    const planRef = doc(window.db, "plans", String(planId));
    await deleteDoc(planRef);
}

// ========== 网页内置固定数据 ==========
let planData = window.planData || [];
let baseMemberList = ["章鱼肉","祈宫","小曼","夏熙"];
let allMemberOpt = [...baseMemberList];
const statusArr = ["未确定角色","无装备","仅有假发","仅有服饰道具","已准备齐全"];
const selectRoleList = ["摄影","后勤"];
let nowDate = new Date();
let showYear = nowDate.getFullYear();
let showMonth = nowDate.getMonth();
let currentViewPlan = null;
let editTargetMemberName = "";

// 同步 planData 引用
window.planData = planData;

// 初始化省份
function initProvinceSelect(){
    let pSel = document.getElementById("provinceSel");
    Object.keys(areaData).forEach(p=>pSel.innerHTML += `<option value="${p}">${p}</option>`);
}

// 省份联动城市
function changeProvince(){
    let p = document.getElementById("provinceSel").value;
    let cSel = document.getElementById("citySel");
    cSel.innerHTML = "<option value=''>请选择城市</option>";
    if(!p)return;
    areaData[p].forEach(c=>cSel.innerHTML += `<option value="${c}">${c}</option>`);
}

// 获取当日所有IP
function getSameDayAllIp(dateStr){
    return [...new Set(planData.filter(i=>i.date===dateStr).map(i=>i.ip))];
}

// 选中同一天已有IP → 自动填充相同地点
function autoFillAddressByIp(){
    let date = document.getElementById("planDateSel").value;
    let selIp = document.getElementById("existIpSel").value;
    if(!selIp) return;
    let sameIpInfo = planData.find(item=>item.date===date && item.ip===selIp);
    if(!sameIpInfo) return;
    document.getElementById("provinceSel").value = sameIpInfo.province || "";
    changeProvince();
    setTimeout(()=>{
        document.getElementById("citySel").value = sameIpInfo.city || "";
    },50);
    document.getElementById("addressInput").value = sameIpInfo.address || "";
}

// 刷新当日IP下拉
function refreshSameDayIp(){
    let date = document.getElementById("planDateSel").value;
    let ips = getSameDayAllIp(date);
    let sel = document.getElementById("existIpSel");
    sel.innerHTML = `<option value="">手动填写新IP</option>`;
    ips.forEach(ip=>sel.innerHTML += `<option value="${ip}">${ip}（当日已有）</option>`);
    document.getElementById("provinceSel").value="";
    document.getElementById("citySel").innerHTML="<option value=''>先选省份</option>";
    document.getElementById("addressInput").value="";
}

// 视图切换
document.getElementById("tabCal").onclick=function(){
    document.getElementById("viewCalendar").classList.remove("hidden");
    document.getElementById("viewList").classList.add("hidden");
    this.classList.add("bg-blue-500","text-white");
    this.classList.remove("bg-white","border");
    document.getElementById("tabList").classList.remove("bg-blue-500","text-white");
    document.getElementById("tabList").classList.add("bg-white","border");
    renderCalendar();
};
document.getElementById("tabList").onclick=function(){
    document.getElementById("viewList").classList.remove("hidden");
    document.getElementById("viewCalendar").classList.add("hidden");
    this.classList.add("bg-blue-500","text-white");
    this.classList.remove("bg-white","border");
    document.getElementById("tabCal").classList.remove("bg-blue-500","text-white");
    document.getElementById("tabCal").classList.add("bg-white","border");
    renderPlanList();
};

function prevMonth(){showMonth--;if(showMonth<0){showMonth=11;showYear--;}renderCalendar();}
function nextMonth(){showMonth++;if(showMonth>11){showMonth=0;showYear++;}renderCalendar();}

function renderCalendar(){
    document.getElementById("curMonthText").innerText = `${showYear}年${showMonth+1}月`;
    let firstDay = new Date(showYear,showMonth,1).getDay();
    let totalDay = new Date(showYear,showMonth+1,0).getDate();
    let box = document.getElementById("calendarBox");
    box.innerHTML = "";
    for(let i=0;i<firstDay;i++) box.innerHTML += `<div class="calendar-day bg-gray-50 rounded p-2"></div>`;
    for(let d=1;d<=totalDay;d++){
        let dateStr = `${showYear}-${String(showMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        let hasPlan = planData.some(item=>item.date===dateStr);
        box.innerHTML += `
        <div class="calendar-day bg-white border rounded p-2 cursor-pointer hover:border-blue-400" onclick="openDatePlanView('${dateStr}')">
            <div class="font-medium">${d}</div>
            ${hasPlan?'<div class="flex gap-1 mt-1"><span class="tag-dot bg-blue-500"></span></div>':''}
        </div>`;
    }
}

function openAddPlanModal(){
    document.getElementById("addPlanModal").classList.remove("hidden");
    document.getElementById("editGroupId").value="";
    document.getElementById("planDateSel").value = new Date().toISOString().split("T")[0];
    refreshSameDayIp();
    refreshMemberCheck();
    document.getElementById("memberInfoWrap").innerHTML = '<p class="text-sm text-gray-500">勾选成员后填写角色与状态</p>';
}
function closeAddModal(){document.getElementById("addPlanModal").classList.add("hidden");}

function refreshMemberCheck(){
    let box = document.getElementById("memberCheckBox");
    box.innerHTML = "";
    allMemberOpt.forEach(name=>{
        box.innerHTML += `<label class="flex items-center gap-1 border px-2 py-1 rounded cursor-pointer"><input type="checkbox" value="${name}" onchange="changeMemberSelect()"> ${name}</label>`;
    });
}

function addNewMemberOpt(){
    let name = document.getElementById("addMemberInput").value.trim();
    if(!name||allMemberOpt.includes(name))return;
    allMemberOpt.push(name);
    document.getElementById("addMemberInput").value="";
    refreshMemberCheck();
}

function changeMemberSelect(){
    let checks = document.querySelectorAll("#memberCheckBox input:checked");
    let wrap = document.getElementById("memberInfoWrap");
    let html = '<p class="text-sm text-gray-500">勾选成员后填写角色与状态</p>';
    checks.forEach(cb=>{
        let uname = cb.value;
        html += `
        <div class="border-t pt-2 mt-2">
            <p class="font-medium">${uname}</p>
            <div class="grid grid-cols-2 gap-2 mt-1">
                <div>
                    <select class="pre-role border rounded p-1" data-name="${uname}">
                        <option value="">自定义角色</option>
                        ${selectRoleList.map(r=>`<option value="${r}">${r}</option>`).join("")}
                    </select>
                    <input type="text" class="mem-role border rounded p-1 mt-1" data-name="${uname}" placeholder="自定义扮演角色">
                </div>
                <select class="mem-status border rounded p-1" data-name="${uname}">
                    ${statusArr.map(s=>`<option value="${s}">${s}</option>`).join("")}
                </select>
            </div>
        </div>`;
    });
    wrap.innerHTML = html;
    document.querySelectorAll(".pre-role").forEach(s=>{
        s.onchange=function(){
            let n=this.dataset.name,v=this.value;
            let st=document.querySelector(`.mem-status[data-name="${n}"]`);
            let inp=document.querySelector(`.mem-role[data-name="${n}"]`);
            if(selectRoleList.includes(v)){st.style.display="none";inp.value=v;inp.disabled=true;}
            else{st.style.display="block";inp.disabled=false;}
        }
    });
}

async function saveGroupPlan(){
    let editId = document.getElementById("editGroupId").value;
    let date = document.getElementById("planDateSel").value;
    let selIp = document.getElementById("existIpSel").value;
    let newIp = document.getElementById("newIpInput").value.trim();
    let ipName = selIp||newIp;
    let type = document.getElementById("planTypeSel").value;
    let province = document.getElementById("provinceSel").value;
    let city = document.getElementById("citySel").value;
    let address = document.getElementById("addressInput").value.trim();
    if(!date||!ipName){alert("请选择日期并填写IP");return;}

    let memberArr = [];
    document.querySelectorAll(".mem-role").forEach(ri=>{
        let un=ri.dataset.name,ro=ri.value.trim();
        let st="";
        document.querySelectorAll(".mem-status").forEach(si=>{if(si.dataset.name===un)st=si.value;});
        if(!ro){alert(`请填写${un}角色`);throw "";}
        memberArr.push({userName:un,userRole:ro,userStatus:st});
    });
    if(memberArr.length===0){alert("请勾选成员");return;}

    if(editId){
        let idx = planData.findIndex(p=>p.id==editId);
        if(idx>-1){
            planData[idx]={...planData[idx],date,ip:ipName,planType:type,province,city,address,memberList:memberArr};
        }
    }else{
        let exist = planData.find(p=>p.date===date&&p.ip===ipName&&p.planType===type);
        if(exist) exist.memberList.push(...memberArr);
        else planData.push({id:Date.now(),date,ip:ipName,planType:type,province,city,address,memberList:memberArr});
    }
    closeAddModal();
    renderCalendar();
    renderPlanList();
    await syncAllPlansToFirestore();
    alert("保存成功！同IP自动共用地点");
}

function renderPlanList(){
    let box = document.getElementById("planListBox");
    box.innerHTML = "";
    let map = {};
    planData.forEach(item=>{
        let k=`${item.date}|${item.ip}|${item.planType}`;
        if(!map[k])map[k]={...item,memberList:[]};
        map[k].memberList.push(...item.memberList);
    });
    let list = Object.values(map).sort((a,b)=>a.date.localeCompare(b.date));
    if(list.length===0){box.innerHTML='<div class="text-center py-10 text-gray-500">暂无计划</div>';return;}
    list.forEach(item=>{
        box.innerHTML += `
        <div class="bg-white p-4 rounded-lg border cursor-pointer hover:shadow" onclick='openPlanDetail(${JSON.stringify(item).replace(/'/g, "&#39;")})'>
            <div class="flex justify-between">
                <span class="font-medium">${item.date} | ${item.ip} | ${item.planType}</span>
                <span class="text-gray-400">${item.memberList.length}人</span>
            </div>
            <div class="text-sm text-gray-600 mt-1">地点：${item.province||""}${item.city||""} | 参与：${item.memberList.map(m=>m.userName).join("、")}</div>
        </div>`;
    });
}

function openDatePlanView(date){
    let arr = planData.filter(p=>p.date===date);
    if(!arr.length){alert("当日暂无计划");return;}
    let map={};
    arr.forEach(i=>{let k=`${i.date}|${i.ip}|${i.planType}`;if(!map[k])map[k]={...i,memberList:[]};map[k].memberList.push(...i.memberList);});
    openPlanDetail(Object.values(map)[0]);
}

function openPlanDetail(data){
    currentViewPlan = data;
    document.getElementById("detailTitle").innerText = `${data.date} ${data.ip} ${data.planType} 详情`;
    document.getElementById("showProvinceCity").innerText = `${data.province||""}${data.city||""}`||"未填写";
    document.getElementById("showAddress").innerText = data.address||"无";
    let html="";
    data.memberList.forEach(m=>{
        let txt = selectRoleList.includes(m.userRole)?"无需准备状态":m.userStatus;
        html += `
        <div class="border p-3 rounded flex justify-between items-start">
            <div>
                <p><b>成员：</b>${m.userName}</p>
                <p><b>扮演角色：</b>${m.userRole}</p>
                <p><b>准备状态：</b>${txt}</p>
            </div>
            <button class="edit-item-btn bg-amber-400 text-white px-2 py-1 rounded" onclick="openSingleMemberEdit('${m.userName}')">编辑此成员</button>
        </div>`;
    });
    document.getElementById("detailContent").innerHTML=html;
    document.getElementById("detailModal").classList.remove("hidden");
}

function openSingleMemberEdit(name){
    editTargetMemberName=name;
    let m = currentViewPlan.memberList.find(x=>x.userName===name);
    if(!m)return;
    document.getElementById("editMemberName").innerText=`编辑${name}信息`;
    document.getElementById("editQuickRole").value=selectRoleList.includes(m.userRole)?m.userRole:"";
    document.getElementById("editRoleInput").value=m.userRole;
    let stSel=document.getElementById("editStatusSel");
    stSel.innerHTML=statusArr.map(s=>`<option value="${s}">${s}</option>`).join("");
    stSel.value=m.userStatus;
    switchEditRoleType();
    document.getElementById("memberEditModal").classList.remove("hidden");
}

function switchEditRoleType(){
    let v=document.getElementById("editQuickRole").value;
    let inp=document.getElementById("editRoleInput");
    let box=document.getElementById("editStatusBox");
    if(selectRoleList.includes(v)){inp.value=v;inp.disabled=true;box.style.display="none";}
    else{inp.disabled=false;box.style.display="block";}
}

async function saveMemberEdit(){
    let r=document.getElementById("editRoleInput").value.trim();
    let s=document.getElementById("editStatusSel").value;
    if(!r){alert("角色不能为空");return;}
    let idx=currentViewPlan.memberList.findIndex(x=>x.userName===editTargetMemberName);
    if(idx>-1){
        currentViewPlan.memberList[idx].userRole=r;
        currentViewPlan.memberList[idx].userStatus=selectRoleList.includes(r)?"":s;
    }
    let mainIdx=planData.findIndex(p=>p.id===currentViewPlan.id);
    if(mainIdx>-1) planData[mainIdx].memberList=currentViewPlan.memberList;
    closeMemberEdit();
    openPlanDetail(currentViewPlan);
    await syncAllPlansToFirestore();
    alert("修改完成");
}
function closeMemberEdit(){document.getElementById("memberEditModal").classList.add("hidden");}

async function delCurrentPlan(){
    if(!confirm("确定删除？"))return;
    planData=planData.filter(p=>p.id!==currentViewPlan.id);
    closeDetailModal();
    renderCalendar();
    renderPlanList();
    await deletePlanFromFirestore(currentViewPlan.id);
    alert("删除成功");
}
function closeDetailModal(){document.getElementById("detailModal").classList.add("hidden");currentViewPlan=null;}
