// ========== 全局变量 ==========
let planData = [];
let globalIpList = [];
let globalMemberList = ["章鱼肉","祈宫","小曼","夏熙"];
let currentViewPlan = null;
let currentMergedPlanKey = null;  // 当前打开的合并计划的 key
let showYear = new Date().getFullYear();
let showMonth = new Date().getMonth();

const selectRoleList = ["摄影","后勤"];
const statusArr = ["未确定角色","无装备","仅有假发","仅有服饰道具","已准备齐全"];

// ========== 初始化省份 ==========
function initProvinceSelect() {
    let pSel = document.getElementById("provinceSel");
    pSel.innerHTML = '<option value="">请选择省份</option>';
    Object.keys(areaData).forEach(p => {
        pSel.innerHTML += `<option value="${p}">${p}</option>`;
    });
}

function changeProvince() {
    let p = document.getElementById("provinceSel").value;
    let cSel = document.getElementById("citySel");
    cSel.innerHTML = '<option value="">请选择城市</option>';
    if (!p || !areaData[p]) return;
    areaData[p].forEach(c => {
        cSel.innerHTML += `<option value="${c}">${c}</option>`;
    });
}

// ========== 加载全局数据 ==========
async function loadGlobalLists() {
    try {
        const ipSnapshot = await db.collection("global_ips").get();
        if (!ipSnapshot.empty) {
            globalIpList = [];
            ipSnapshot.forEach(doc => globalIpList.push(doc.data().name));
        } else {
            globalIpList = [];
            await db.collection("global_ips").doc("default").set({name:"默认IP"});
            globalIpList.push("默认IP");
        }
        const memberSnapshot = await db.collection("global_members").get();
        if (!memberSnapshot.empty) {
            globalMemberList = [];
            memberSnapshot.forEach(doc => globalMemberList.push(doc.data().name));
        } else {
            for (let m of globalMemberList) {
                await db.collection("global_members").doc(m).set({name:m});
            }
        }
        refreshIpSelect();
        refreshMemberCheck();
    } catch(e) {
        console.error("加载全局数据失败", e);
    }
}

async function saveNewIp(ip) {
    if (!ip || globalIpList.includes(ip)) return;
    globalIpList.push(ip);
    await db.collection("global_ips").doc(ip).set({name:ip});
    refreshIpSelect();
}

async function saveNewMember(name) {
    if (!name || globalMemberList.includes(name)) return;
    globalMemberList.push(name);
    await db.collection("global_members").doc(name).set({name:name});
    refreshMemberCheck();
}

function refreshIpSelect() {
    let sel = document.getElementById("existIpSel");
    sel.innerHTML = '<option value="">选择已有IP</option>';
    globalIpList.forEach(ip => {
        sel.innerHTML += `<option value="${ip}">${ip}</option>`;
    });
}

function refreshMemberCheck() {
    let box = document.getElementById("memberCheckBox");
    box.innerHTML = "";
    globalMemberList.forEach(name => {
        box.innerHTML += `<label class="flex items-center gap-1 border px-2 py-1 rounded cursor-pointer"><input type="checkbox" value="${name}" onchange="changeMemberSelect()"> ${name}</label>`;
    });
}

document.getElementById("newIpInput")?.addEventListener("blur", function() {
    let val = this.value.trim();
    if (val) saveNewIp(val);
});
document.getElementById("newMemberInput")?.addEventListener("blur", function() {
    let val = this.value.trim();
    if (val) saveNewMember(val);
});

function autoFillAddressByIp() {
    let date = document.getElementById("planDateSel").value;
    let selIp = document.getElementById("existIpSel").value;
    if (!selIp) return;
    let sameIpInfo = planData.find(item => item.date === date && item.ip === selIp);
    if (!sameIpInfo) return;
    document.getElementById("provinceSel").value = sameIpInfo.province || "";
    changeProvince();
    setTimeout(() => {
        document.getElementById("citySel").value = sameIpInfo.city || "";
    }, 50);
    document.getElementById("addressInput").value = sameIpInfo.address || "";
}

function changeMemberSelect() {
    let checks = document.querySelectorAll("#memberCheckBox input:checked");
    let wrap = document.getElementById("memberInfoWrap");
    let html = '<p class="text-sm text-gray-500">勾选成员后填写角色与状态</p>';
    checks.forEach(cb => {
        let uname = cb.value;
        html += `
        <div class="border-t pt-2 mt-2">
            <p class="font-medium">${uname}</p>
            <div class="grid grid-cols-2 gap-2 mt-1">
                <div>
                    <select class="pre-role border rounded p-1 w-full" data-name="${uname}">
                        <option value="">自定义角色</option>
                        ${selectRoleList.map(r => `<option value="${r}">${r}</option>`).join("")}
                    </select>
                    <input type="text" class="mem-role border rounded p-1 w-full mt-1" data-name="${uname}" placeholder="自定义扮演角色">
                </div>
                <select class="mem-status border rounded p-1 w-full" data-name="${uname}">
                    ${statusArr.map(s => `<option value="${s}">${s}</option>`).join("")}
                </select>
            </div>
        </div>`;
    });
    wrap.innerHTML = html;
    document.querySelectorAll(".pre-role").forEach(s => {
        s.onchange = function() {
            let n = this.dataset.name, v = this.value;
            let st = document.querySelector(`.mem-status[data-name="${n}"]`);
            let inp = document.querySelector(`.mem-role[data-name="${n}"]`);
            if (selectRoleList.includes(v)) {
                st.style.display = "none";
                inp.value = v;
                inp.disabled = true;
            } else {
                st.style.display = "block";
                inp.disabled = false;
            }
        };
    });
}

// ========== 催促功能 ==========
async function addUrgeInDetail(planKey, memberName) {
    // planKey 格式: date|ip|planType
    let plans = planData.filter(p => `${p.date}|${p.ip}|${p.planType}` === planKey);
    if (plans.length === 0) return;
    let member = null;
    for (let plan of plans) {
        let m = plan.memberList.find(m => m.userName === memberName);
        if (m) {
            member = m;
            break;
        }
    }
    if (!member) return;
    if (member.userStatus === "已准备齐全") {
        alert("该成员已准备齐全，无法催促");
        return;
    }
    member.urgeCount = (member.urgeCount || 0) + 1;
    if (member.urgeCount > 10) member.urgeCount = 10;
    
    // 同步所有相关计划到 Firestore
    for (let plan of plans) {
        await syncSinglePlanToFirestore(plan);
    }
    // 刷新详情弹窗
    openMergedPlanDetail(planKey);
}

function getUrgeIcons(count) {
    if (!count || count === 0) return "无催促";
    let icons = "";
    for (let i = 0; i < Math.min(count, 10); i++) icons += "🔥";
    return icons;
}

async function changeMemberStatusInDetail(planKey, memberName, newStatus) {
    let plans = planData.filter(p => `${p.date}|${p.ip}|${p.planType}` === planKey);
    if (plans.length === 0) return;
    for (let plan of plans) {
        let member = plan.memberList.find(m => m.userName === memberName);
        if (member) {
            member.userStatus = newStatus;
            if (newStatus === "已准备齐全") {
                member.urgeCount = 0;
            }
            await syncSinglePlanToFirestore(plan);
        }
    }
    openMergedPlanDetail(planKey);
}

async function deleteMemberFromPlan(planKey, memberName) {
    if (!confirm(`确定将 ${memberName} 从该计划中移除吗？`)) return;
    let plans = planData.filter(p => `${p.date}|${p.ip}|${p.planType}` === planKey);
    for (let plan of plans) {
        plan.memberList = plan.memberList.filter(m => m.userName !== memberName);
        if (plan.memberList.length === 0) {
            // 如果没有成员了，删除整个计划
            planData = planData.filter(p => p.id !== plan.id);
            await db.collection("plans").doc(String(plan.id)).delete();
        } else {
            await syncSinglePlanToFirestore(plan);
        }
    }
    // 重新加载并刷新
    await loadPlansFromFirestore();
    renderPlanList();
    closeDetailModal();
    alert(`已移除 ${memberName}`);
}

async function syncSinglePlanToFirestore(plan) {
    const planRef = db.collection("plans").doc(String(plan.id));
    const { id, ...data } = plan;
    await planRef.set(data);
}

async function loadPlansFromFirestore() {
    const snapshot = await db.collection("plans").get();
    planData = [];
    snapshot.forEach(doc => {
        let data = doc.data();
        data.id = doc.id;
        planData.push(data);
    });
}

// ========== 合并计划列表渲染 ==========
function renderPlanList() {
    let box = document.getElementById("planListBox");
    if (!box) return;
    box.innerHTML = "";
    
    // 合并计划：按 date|ip|planType 分组
    let mergedMap = new Map();
    planData.forEach(plan => {
        let key = `${plan.date}|${plan.ip}|${plan.planType}`;
        if (!mergedMap.has(key)) {
            mergedMap.set(key, {
                key: key,
                date: plan.date,
                ip: plan.ip,
                planType: plan.planType,
                province: plan.province,
                city: plan.city,
                address: plan.address,
                memberCount: 0,
                urgeCount: 0
            });
        }
        let merged = mergedMap.get(key);
        merged.memberCount += plan.memberList.length;
        plan.memberList.forEach(m => {
            merged.urgeCount += (m.urgeCount || 0);
        });
    });
    
    let mergedList = Array.from(mergedMap.values()).sort((a,b) => (a.date || "").localeCompare(b.date || ""));
    
    if (mergedList.length === 0) {
        box.innerHTML = '<div class="text-center py-10 text-gray-500">暂无计划</div>';
        return;
    }
    
    mergedList.forEach(merged => {
        let urgeIcon = merged.urgeCount > 0 ? `🔥${merged.urgeCount}` : "";
        let planDiv = document.createElement("div");
        planDiv.className = "bg-white p-4 rounded-lg border mb-3 cursor-pointer hover:shadow";
        planDiv.onclick = () => openMergedPlanDetail(merged.key);
        planDiv.innerHTML = `
            <div class="flex justify-between items-start">
                <div>
                    <div class="font-medium">📅 ${merged.date} | ${merged.ip} | ${merged.planType}</div>
                    <div class="text-sm text-gray-600 mt-1">📍 ${merged.province || ""}${merged.city || ""} ${merged.address || ""}</div>
                    <div class="text-sm text-gray-500 mt-1">👥 ${merged.memberCount} 人参与</div>
                </div>
                <div class="text-orange-500 text-xl">${urgeIcon}</div>
            </div>
        `;
        box.appendChild(planDiv);
    });
}

// ========== 打开合并后的计划详情 ==========
function openMergedPlanDetail(planKey) {
    currentMergedPlanKey = planKey;
    let plans = planData.filter(p => `${p.date}|${p.ip}|${p.planType}` === planKey);
    if (plans.length === 0) return;
    
    let firstPlan = plans[0];
    document.getElementById("detailTitle").innerHTML = `📅 ${firstPlan.date} | ${firstPlan.ip} | ${firstPlan.planType}`;
    document.getElementById("showProvinceCity").innerText = `${firstPlan.province || ""}${firstPlan.city || ""}` || "未填写";
    document.getElementById("showAddress").innerText = firstPlan.address || "无";
    
    // 收集所有成员（去重，但保留每个成员的所有信息，取第一个出现的）
    let memberMap = new Map();
    for (let plan of plans) {
        for (let m of plan.memberList) {
            if (!memberMap.has(m.userName)) {
                memberMap.set(m.userName, { ...m });
            }
        }
    }
    let memberList = Array.from(memberMap.values());
    
    let html = "";
    memberList.forEach(m => {
        let txt = selectRoleList.includes(m.userRole) ? "无需准备状态" : (m.userStatus || "未确定角色");
        html += `
        <div class="border p-3 rounded">
            <div class="flex flex-wrap items-start justify-between gap-2">
                <div class="flex-1">
                    <p><b>👤 ${m.userName}</b></p>
                    <p><b>角色：</b>${m.userRole || "未填"}</p>
                    <p><b>状态：</b>${txt}</p>
                    <p><b>🔥 催促：</b>${getUrgeIcons(m.urgeCount || 0)}</p>
                </div>
                <div class="flex flex-col gap-2">
                    <button class="urge-btn px-3 py-1 bg-orange-400 text-white rounded text-sm" onclick="addUrgeInDetail('${planKey}', '${m.userName}')">➕ 催促</button>
                    <select class="status-select-detail border rounded text-sm p-1" data-member="${m.userName}">
                        ${statusArr.map(s => `<option value="${s}" ${(m.userStatus === s) ? "selected" : ""}>${s}</option>`).join("")}
                    </select>
                    <button class="delete-member-btn px-3 py-1 bg-red-400 text-white rounded text-sm" onclick="deleteMemberFromPlan('${planKey}', '${m.userName}')">🗑 删除此人</button>
                </div>
            </div>
        </div>`;
    });
    
    document.getElementById("detailContent").innerHTML = html;
    
    // 绑定状态下拉框事件
    document.querySelectorAll(".status-select-detail").forEach(sel => {
        sel.addEventListener("change", function() {
            let memberName = this.dataset.member;
            changeMemberStatusInDetail(planKey, memberName, this.value);
        });
    });
    
    document.getElementById("detailModal").classList.remove("hidden");
}

// ========== 保存计划 ==========
async function saveGroupPlan() {
    let date = document.getElementById("planDateSel").value;
    let selIp = document.getElementById("existIpSel").value;
    let newIp = document.getElementById("newIpInput").value.trim();
    let ipName = selIp || newIp;
    if (!date || !ipName) { alert("请选择日期并填写IP"); return; }
    if (newIp) await saveNewIp(newIp);
    
    let type = document.getElementById("planTypeSel").value;
    let province = document.getElementById("provinceSel").value;
    let city = document.getElementById("citySel").value;
    let address = document.getElementById("addressInput").value.trim();
    
    let memberArr = [];
    document.querySelectorAll(".mem-role").forEach(ri => {
        let un = ri.dataset.name;
        let ro = ri.value.trim();
        if (!ro) ro = "待定";
        let st = document.querySelector(`.mem-status[data-name="${un}"]`)?.value || "未确定角色";
        memberArr.push({ userName: un, userRole: ro, userStatus: st, urgeCount: 0 });
    });
    if (memberArr.length === 0) { alert("请勾选成员"); return; }
    
    let newPlan = {
        id: Date.now(),
        date, ip: ipName, planType: type,
        province, city, address,
        memberList: memberArr
    };
    planData.push(newPlan);
    await db.collection("plans").doc(String(newPlan.id)).set(newPlan);
    closeAddModal();
    renderCalendar();
    renderPlanList();
    alert("保存成功");
}

// ========== 日历渲染 ==========
function renderCalendar() {
    let monthText = document.getElementById("curMonthText");
    if (monthText) monthText.innerText = `${showYear}年${showMonth+1}月`;
    let firstDay = new Date(showYear, showMonth, 1).getDay();
    let totalDay = new Date(showYear, showMonth+1, 0).getDate();
    let box = document.getElementById("calendarBox");
    if (!box) return;
    box.innerHTML = "";
    for (let i = 0; i < firstDay; i++) {
        box.innerHTML += `<div class="calendar-day bg-gray-50 rounded p-2"></div>`;
    }
    for (let d = 1; d <= totalDay; d++) {
        let dateStr = `${showYear}-${String(showMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        let dayPlans = planData.filter(p => p.date === dateStr);
        let hasPlan = dayPlans.length > 0;
        let planIcons = "";
        if (hasPlan) {
            let allUrgeCount = 0;
            dayPlans.forEach(p => {
                if (p.memberList) {
                    p.memberList.forEach(m => { allUrgeCount += (m.urgeCount || 0); });
                }
            });
            planIcons = allUrgeCount > 0 ? `<span class="text-xs">🔥${allUrgeCount}</span>` : `<span class="tag-dot bg-blue-500 inline-block"></span>`;
        }
        box.innerHTML += `
        <div class="calendar-day bg-white border rounded p-2 cursor-pointer hover:border-blue-400" onclick="openDatePlanView('${dateStr}')">
            <div class="font-medium">${d}</div>
            ${hasPlan ? `<div class="flex gap-1 mt-1">${planIcons}</div>` : ""}
        </div>`;
    }
}

function openDatePlanView(date) {
    let plans = planData.filter(p => p.date === date);
    if (!plans.length) { alert("当日暂无计划"); return; }
    // 如果有多个计划，显示第一个合并的详情
    let firstPlan = plans[0];
    let planKey = `${firstPlan.date}|${firstPlan.ip}|${firstPlan.planType}`;
    openMergedPlanDetail(planKey);
}

function prevMonth() { showMonth--; if (showMonth < 0) { showMonth = 11; showYear--; } renderCalendar(); }
function nextMonth() { showMonth++; if (showMonth > 11) { showMonth = 0; showYear++; } renderCalendar(); }

// ========== 删除整个计划 ==========
async function delCurrentPlan() {
    if (!confirm("确定删除整个计划吗？")) return;
    let plans = planData.filter(p => `${p.date}|${p.ip}|${p.planType}` === currentMergedPlanKey);
    for (let plan of plans) {
        planData = planData.filter(p => p.id !== plan.id);
        await db.collection("plans").doc(String(plan.id)).delete();
    }
    closeDetailModal();
    renderCalendar();
    renderPlanList();
    alert("删除成功");
}

// ========== 弹窗控制 ==========
function openAddPlanModal() {
    document.getElementById("addPlanModal").classList.remove("hidden");
    document.getElementById("editGroupId").value = "";
    document.getElementById("planDateSel").value = new Date().toISOString().split("T")[0];
    document.getElementById("newIpInput").value = "";
    document.getElementById("newMemberInput").value = "";
    refreshMemberCheck();
    document.getElementById("memberInfoWrap").innerHTML = '<p class="text-sm text-gray-500">勾选成员后填写角色与状态</p>';
    document.getElementById("provinceSel").value = "";
    document.getElementById("citySel").innerHTML = '<option value="">先选省份</option>';
    document.getElementById("addressInput").value = "";
}
function closeAddModal() { document.getElementById("addPlanModal").classList.add("hidden"); }
function closeDetailModal() { document.getElementById("detailModal").classList.add("hidden"); currentMergedPlanKey = null; }

// ========== 视图切换 ==========
document.getElementById("tabCal")?.addEventListener("click", function() {
    document.getElementById("viewCalendar").classList.remove("hidden");
    document.getElementById("viewList").classList.add("hidden");
    this.classList.add("bg-blue-500","text-white");
    this.classList.remove("bg-white","border");
    let listBtn = document.getElementById("tabList");
    listBtn.classList.remove("bg-blue-500","text-white");
    listBtn.classList.add("bg-white","border");
    renderCalendar();
});
document.getElementById("tabList")?.addEventListener("click", function() {
    document.getElementById("viewList").classList.remove("hidden");
    document.getElementById("viewCalendar").classList.add("hidden");
    this.classList.add("bg-blue-500","text-white");
    this.classList.remove("bg-white","border");
    let calBtn = document.getElementById("tabCal");
    calBtn.classList.remove("bg-blue-500","text-white");
    calBtn.classList.add("bg-white","border");
    renderPlanList();
});

// ========== 实时监听 ==========
function listenPlansRealtime() {
    db.collection("plans").onSnapshot(async snapshot => {
        await loadPlansFromFirestore();
        renderCalendar();
        renderPlanList();
        // 如果当前有打开的详情弹窗，刷新它
        if (currentMergedPlanKey && document.getElementById("detailModal").classList.contains("hidden") === false) {
            openMergedPlanDetail(currentMergedPlanKey);
        }
    });
}

// ========== 启动 ==========
initProvinceSelect();
renderCalendar();
renderPlanList();
loadGlobalLists().then(async () => {
    await loadPlansFromFirestore();
    renderCalendar();
    renderPlanList();
    listenPlansRealtime();
});
</script>
